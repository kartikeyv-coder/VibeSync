<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0b0f19"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Chat Icon Gradients -->
    <linearGradient id="bubble1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="bubble2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Ambient Glows -->
  <rect width="1200" height="400" fill="url(#cyanGlow)"/>
  <rect width="1200" height="400" fill="url(#indigoGlow)"/>

  <!-- Subtle Grid Dots Pattern -->
  <g opacity="0.12">
    <pattern id="gridDots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#gridDots)"/>
  </g>

  <!-- Tech Accent Wave/Circle Lines -->
  <g opacity="0.2" stroke="#6366f1" stroke-width="1.2" fill="none">
    <circle cx="1060" cy="180" r="120" stroke-dasharray="4 6"/>
    <circle cx="1060" cy="180" r="190" stroke-dasharray="8 8"/>
    <circle cx="1060" cy="180" r="260"/>
  </g>

  <!-- Left Side: Main Brand & Typography -->
  <g transform="translate(90, 85)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#34d399" filter="url(#neonGlow)"/>
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">REAL-TIME WEBSOCKETS</text>

    <!-- Main Title -->
    <text x="0" y="96" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      VibeSync<tspan fill="#38bdf8">.</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="140" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="20" font-weight="400">
      Next-Gen Multi-Room Group Messaging Experience
    </text>
    <text x="0" y="168" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="14" font-weight="400">
      Ultra-low latency socket pipelines • Room presence syncing • Glassmorphic UI
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 198)">
      <!-- Badge 1: React -->
      <g>
        <rect x="0" y="0" width="105" height="30" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="52" y="20" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚛️ React 18</text>
      </g>
      <!-- Badge 2: Socket.io -->
      <g transform="translate(115, 0)">
        <rect x="0" y="0" width="120" height="30" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="60" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Socket.IO</text>
      </g>
      <!-- Badge 3: Tailwind -->
      <g transform="translate(245, 0)">
        <rect x="0" y="0" width="130" height="30" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="65" y="20" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎨 Tailwind v4</text>
      </g>
      <!-- Badge 4: Express -->
      <g transform="translate(385, 0)">
        <rect x="0" y="0" width="120" height="30" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="60" y="20" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Node/Express</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Graphic Representation of Floating Glass Chat Card -->
  <g transform="translate(770, 60)" filter="url(#cardShadow)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="340" height="280" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect x="0" y="0" width="340" height="50" rx="20" fill="#1e293b" fill-opacity="0.9"/>
    <rect x="0" y="30" width="340" height="20" fill="#1e293b" fill-opacity="0.9"/>
    
    <!-- Status Dot -->
    <circle cx="26" cy="25" r="5" fill="#34d399" filter="url(#neonGlow)"/>
    <text x="42" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700"># developers-hangout</text>
    
    <!-- Close icon mock -->
    <circle cx="314" cy="25" r="10" fill="#334155"/>
    <text x="314" y="29" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">✕</text>

    <!-- Message Bubble 1 (Incoming Admin) -->
    <g transform="translate(20, 68)">
      <rect width="260" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">🤖 <tspan fill="#38bdf8" font-weight="600">admin:</tspan> Welcome Alex to the room!</text>
    </g>

    <!-- Message Bubble 2 (Incoming Friend) -->
    <g transform="translate(20, 114)">
      <rect width="210" height="42" rx="12" fill="#334155" fill-opacity="0.8"/>
      <text x="12" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="600">Sarah</text>
      <text x="12" y="32" fill="#ffffff" font-family="sans-serif" font-size="12">Hey everyone, ready for demo? 🚀</text>
    </g>

    <!-- Message Bubble 3 (User Self Sent) -->
    <g transform="translate(100, 166)">
      <rect width="220" height="42" rx="12" fill="url(#bubble1Grad)"/>
      <text x="14" y="18" fill="#e0e7ff" font-family="sans-serif" font-size="10" font-weight="600">You</text>
      <text x="14" y="32" fill="#ffffff" font-family="sans-serif" font-size="12">Absolutely! VibeSync is blazing fast ⚡</text>
    </g>

    <!-- Bottom Input Bar Mock -->
    <g transform="translate(20, 224)">
      <rect width="235" height="38" rx="10" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-family="sans-serif" font-size="12">Type a message...</text>
      
      <rect x="245" y="0" width="55" height="38" rx="10" fill="#6366f1"/>
      <text x="272" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Send</text>
    </g>
  </g>
</svg>
